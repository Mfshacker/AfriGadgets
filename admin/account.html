<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Account | AfriGadgets Admin</title>

    <link rel="stylesheet" href="../css/admin/admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="admin-logo">Afri<span>Gadgets</span></div>

        <div class="admin-label">ADMIN PANEL</div>

        <nav>
          <a href="index.html">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
          </a>

          <a href="products.html">
            <i class="fa-solid fa-box"></i>
            <span>Products</span>
          </a>

          <a href="orders.html">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Orders</span>
          </a>

          <a href="customers.html">
            <i class="fa-solid fa-users"></i>
            <span>Customers</span>
          </a>

          <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </a>

          <a href="account.html">
            <i class="fa-solid fa-user-gear"></i>
            <span>My Account</span>
          </a>
        </nav>

        <a href="../index.html" class="view-store">
          <i class="fa-solid fa-store"></i>
          <span>View Store</span>
        </a>

        <div class="sidebar-toggle">
          <button type="button" id="sidebarToggle" title="Collapse sidebar">
            <i class="fa-solid fa-angles-left"></i>
          </button>
        </div>
      </aside>

      <!-- MAIN -->

      <main class="admin-main">
        <!-- HEADER -->

        <header class="admin-header">
          <div class="admin-header-top">
            <div>
              <span> AFRIGADGETS ADMIN </span>

              <h1>My Account</h1>
            </div>

            <div class="admin-user">
              <button
                type="button"
                class="admin-user-trigger"
                id="adminUserTrigger"
              >
                <div class="admin-avatar" id="adminAvatarLetter">A</div>

                <div>
                  <strong id="adminUserName"> Administrator </strong>

                  <small> Admin </small>
                </div>

                <i class="fa-solid fa-chevron-down"></i>
              </button>

              <div class="admin-user-menu">
                <a href="account.html">
                  <i class="fa-solid fa-user"></i>
                  My Account
                </a>

                <a href="settings.html">
                  <i class="fa-solid fa-gear"></i>
                  Settings
                </a>

                <hr />

                <button type="button" id="adminLogout">
                  <i class="fa-solid fa-right-from-bracket"></i>
                  Sign out
                </button>
              </div>
            </div>
          </div>

          <div class="admin-breadcrumb" id="adminBreadcrumb"></div>
        </header>

        <!-- MY ACCOUNT -->

        <section class="admin-section">
          <div class="section-header">
            <div>
              <span> MY ACCOUNT </span>

              <h2>My Account</h2>
            </div>
          </div>

          <div class="settings-grid">
            <!-- ADMIN PROFILE -->

            <div class="settings-card">
              <div class="settings-card-header">
                <div class="settings-card-icon">
                  <i class="fa-solid fa-user"></i>
                </div>

                <div>
                  <h3>Your Profile</h3>

                  <p>Your own name and phone number.</p>
                </div>
              </div>

              <div class="form-group">
                <label> Full Name </label>

                <input type="text" id="adminProfileName" placeholder="Your name" />
              </div>

              <div class="form-group">
                <label> Phone Number </label>

                <input
                  type="text"
                  id="adminProfilePhone"
                  placeholder="+27 XX XXX XXXX"
                />
              </div>

              <div class="form-group">
                <label> Email </label>

                <input type="email" id="adminProfileEmail" disabled />
              </div>

              <p id="profileSaveMessage" class="form-message" role="alert"></p>

              <button
                type="button"
                class="primary-button settings-save"
                onclick="saveAdminProfile()"
              >
                <i class="fa-solid fa-floppy-disk"></i>

                Save Profile
              </button>
            </div>

            <!-- ACCOUNT SECURITY -->

            <div class="settings-card">
              <div class="settings-card-header">
                <div class="settings-card-icon">
                  <i class="fa-solid fa-lock"></i>
                </div>

                <div>
                  <h3>Account Security</h3>

                  <p>Change the password for this admin account.</p>
                </div>
              </div>

              <div class="form-group">
                <label> New Password </label>

                <input
                  type="password"
                  id="settingNewPassword"
                  autocomplete="new-password"
                  minlength="6"
                  placeholder="At least 6 characters"
                />
              </div>

              <div class="form-group">
                <label> Confirm New Password </label>

                <input
                  type="password"
                  id="settingConfirmPassword"
                  autocomplete="new-password"
                  minlength="6"
                  placeholder="Repeat new password"
                />
              </div>

              <p
                id="passwordChangeMessage"
                class="form-message"
                role="alert"
              ></p>

              <button
                type="button"
                class="primary-button settings-save"
                onclick="changeAdminPassword()"
              >
                <i class="fa-solid fa-key"></i>

                Update Password
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- RADIAL QUICK-NAV -->

    <div class="radial-fab" id="radialFab">
      <button
        type="button"
        class="radial-fab-toggle"
        aria-label="Quick navigation"
        aria-expanded="false"
      >
        <i class="fa-solid fa-compass"></i>
      </button>

      <div class="radial-fab-items">
        <a href="index.html" class="radial-fab-item" title="Dashboard">
          <i class="fa-solid fa-chart-line"></i>
        </a>

        <a href="products.html" class="radial-fab-item" title="Products">
          <i class="fa-solid fa-box"></i>
        </a>

        <a href="orders.html" class="radial-fab-item" title="Orders">
          <i class="fa-solid fa-bag-shopping"></i>
        </a>

        <a href="customers.html" class="radial-fab-item" title="Customers">
          <i class="fa-solid fa-users"></i>
        </a>

        <a href="settings.html" class="radial-fab-item" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </a>

        <a href="account.html" class="radial-fab-item" title="My Account">
          <i class="fa-solid fa-user-gear"></i>
        </a>
      </div>
    </div>

    <!-- Authentication runs before dashboard code. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/shared/auth-config.js"></script>
    <script src="../js/shared/auth.js"></script>
    <script src="guard.js"></script>
    <script src="shared.js"></script>
    <script src="../js/shared/radial-fab.js"></script>
    <script src="account.js"></script>
  </body>
</html>
